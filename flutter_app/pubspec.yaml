name: dalili_app
description: "دليلي الدوائي - مساعدك الذكي لقراءة علب الأدوية والروشتات الطبية"
publish_to: "none"
version: 0.0.4+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  shared_preferences_android: 2.4.10

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
