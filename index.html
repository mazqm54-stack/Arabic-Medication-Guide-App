<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#006D77" />
    <meta name="description" content="دليلي الدوائي - مساعد طبي ذكي باللغة العربية لكبار السن لقراءة وشرح علب الأدوية بدقة وتكبير واضح" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دليلي الدوائي" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Zero Startup Theme Flash & Mock Viewport Constraint Handler -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var mockWidth = params.get('mockWidth') || (params.get('viewport') ? params.get('viewport').split('x')[0] : null);
          if (mockWidth) {
            var w = parseInt(mockWidth, 10);
            if (!isNaN(w) && w > 0) {
              var style = document.createElement('style');
              style.id = 'mock-viewport-style';
              style.textContent = [
                'html, body, #root {',
                '  width: ' + w + 'px !important;',
                '  max-width: ' + w + 'px !important;',
                '  min-width: ' + w + 'px !important;',
                '  margin: 0 !important;',
                '  padding: 0 !important;',
                '  overflow-x: hidden !important;',
                '  position: absolute !important;',
                '  left: 0 !important;',
                '  top: 0 !important;',
                '}',
                'nav[role="navigation"], header, div[role="dialog"] {',
                '  width: ' + w + 'px !important;',
                '  max-width: ' + w + 'px !important;',
                '  left: 0 !important;',
                '  right: auto !important;',
                '}'
              ].join('\n');
              document.head.appendChild(style);
            }
          }

          var theme = localStorage.getItem('dalili_theme_preference');
          var isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (meta) meta.setAttribute('content', '#0E1517');
          } else {
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#006D77');
          }
        } catch (e) {}
      })();
    </script>

    <title>دليلي الدوائي | مساعد قراءة الأدوية لكبار السن</title>
  </head>
  <body class="bg-[#F8F9FA] dark:bg-[#0E1517] text-[#1D3557] dark:text-[#E6EEF0] font-sans antialiased min-h-screen selection:bg-teal-100 selection:text-teal-900">
    <noscript>
      <div style="padding: 24px; text-align: center; font-size: 20px; font-family: sans-serif; background-color: #FEF3C7; color: #92400E;">
        يرجى تفعيل الجافاسكريبت لتشغيل تطبيق دليلي الدوائي.
      </div>
    </noscript>
    <div id="root" dir="rtl" class="min-h-screen flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
